spring.main.lazy-initialization=true
spring.main.banner-mode=off
spring.jmx.enabled=false

app.db.enabled=true
app.db.run-on-startup-fix=false

spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.datasource.hikari.minimum-idle=0
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.connection-timeout=20000

spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:validate}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

server.port=${SERVER_PORT:8080}
app.websocket.server-url=${APP_WEBSOCKET_SERVER_URL:ws://localhost:8080/ws-chat}

gemini.url=${GEMINI_URL:https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent}
gemini.api.key=${GEMINI_API_KEY:}

# Gmail SMTP (use an App Password on the Google account: https://myaccount.google.com/apppasswords)
spring.mail.host=${MAIL_SMTP_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_SMTP_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_APP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.default-encoding=UTF-8

# When true, no SMTP send; registration can auto-verify (see AuthServiceImpl)
app.mail.skip-send=${APP_MAIL_SKIP_SEND:false}

# Public HTTP base URL (no trailing slash) used in verification links; must match server.port / deployment URL
app.auth.verification-base-url=${APP_AUTH_VERIFICATION_BASE_URL:http://localhost:8080}
app.auth.verification-token-valid-hours=${APP_AUTH_VERIFICATION_TOKEN_VALID_HOURS:48}
